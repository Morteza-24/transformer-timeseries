# lightning.pytorch==2.6.5
seed_everything: 42
trainer:
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: null
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      name: Electricity_tf_with_pe_96_42
      save_dir: .
      version: null
      offline: false
      dir: null
      id: null
      anonymous: null
      project: transformixer-ablation
      log_model: false
      experiment: null
      prefix: ''
      checkpoint_name: null
      add_file_policy: mutable
      entity: null
      notes: null
      tags: null
      config: null
      config_exclude_keys: null
      config_include_keys: null
      allow_val_change: null
      group: h-methods
      job_type: null
      mode: offline
      force: null
      reinit: null
      resume: null
      resume_from: null
      fork_from: null
      save_code: null
      tensorboard: null
      sync_tensorboard: null
      monitor_gym: null
      settings: null
  callbacks: null
  fast_dev_run: false
  max_epochs: 10
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: null
  log_every_n_steps: null
  enable_checkpointing: null
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  gradient_clip_algorithm: null
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: null
  enable_autolog_hparams: true
  model_registry: null
model:
  class_path: xlstm_mixer.exp.exp.LongTermForecastingExp
  init_args:
    criterion:
      class_path: torch.nn.L1Loss
      init_args:
        size_average: null
        reduce: null
        reduction: mean
    architecture:
      class_path: xlstm_mixer.models.transformixer.Transformixer
      init_args:
        d_model: 1024
        n_heads: 16
        e_layers: 2
        d_ff: null
        dropout: 0.1
        activation: gelu
        use_positional_encoding: true
        use_variate_mixer: true
        max_variates: 2048
    task_options: MULTIVARIATE_2_MULTIVARIATE
data:
  class_path: xlstm_mixer.lit.data.ForecastingTSLibDataModule
  init_args:
    dataset_name: Electricity
    task: LONG_TERM_FORECAST
    batch_size: 32
    seq_len: 96
    label_len: 0
    pred_len: 96
    num_workers: 4
    persistent_workers: true
    embed: timeF
    freq: HOURLY
    root_path: ../../datasets
    seasonal_patterns: Monthly
    forecasting_option: MULTIVARIATE_2_MULTIVARIATE
    target: OT
    augmentation_ratio: 0
    test_mode: false
optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 0.0005
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    weight_decay: 0.0
    amsgrad: false
    foreach: null
    maximize: false
    capturable: false
    differentiable: false
    fused: null
    decoupled_weight_decay: false
lr_scheduler:
  class_path: xlstm_mixer.cli_helper.WarmUpCosineAnnealingScheduler
  init_args:
    warmup_epochs: 2
    gamma: 0.99
    constant_gamma_epochs: 1
    cosine_epochs: 5
    last_epoch: -1
rich_model_summary:
  max_depth: 1
model_checkpoint:
  dirpath: checkpoints/
  filename: epoch={epoch}-val_loss={val/loss:.2f}
  monitor: val/MeanSquaredError
  verbose: false
  save_last: null
  save_top_k: 2
  save_on_exception: false
  save_weights_only: false
  mode: min
  auto_insert_metric_name: false
  every_n_train_steps: null
  train_time_interval: null
  every_n_epochs: null
  save_on_train_epoch_end: null
  enable_version_counter: true
lr_monitor:
  logging_interval: epoch
  log_momentum: false
  log_weight_decay: false
